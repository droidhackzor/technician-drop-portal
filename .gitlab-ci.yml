stages:
  - build
  - test

default:
  image: node:20-bookworm-slim
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  before_script:
    - apt-get update && apt-get install -y openssl ca-certificates && rm -rf /var/lib/apt/lists/*
    - npm ci --cache .npm --prefer-offline

variables:
  NODE_ENV: test
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/technician_drop_portal"
  POSTGRES_DB: "technician_drop_portal"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  JWT_SECRET: "ci-test-secret"
  UPLOAD_DIR: "./uploads"
  GITHUB_BRANCH: "main"

services:
  - name: postgres:16
    alias: postgres

build:
  stage: build
  script:
    - mkdir -p "$UPLOAD_DIR"
    - npx prisma generate
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .next/
      - prisma/
      - package.json
      - package-lock.json

test:
  stage: test
  script:
    - mkdir -p "$UPLOAD_DIR"
    - npx prisma generate
    - npx prisma db push
    - |
      if npm run | grep -q " test"; then
        npm run test
      else
        echo "No test script configured yet."
      fi

code_quality_local:
  stage: test
  allow_failure: true
  script:
    - |
      if npm run | grep -q " lint"; then
        npm run lint
      else
        echo "No lint script configured yet."
      fi